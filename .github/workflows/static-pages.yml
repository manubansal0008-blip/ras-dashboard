name: Build static SEO pages

on:
  workflow_dispatch:
  schedule:
    # 09:13 IST every day, after the 7:13 AM content update
    - cron: '43 3 * * *'

permissions:
  contents: write

concurrency:
  group: static-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pages from the published CMS
        run: python tools/build_static.py
      - name: Commit new pages
        run: |
          git config user.name "rrrshala-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news hi current-affairs editorials sitemap.xml
          if git diff --cached --quiet; then
            echo "No new pages today."
          else
            git commit -m "Static SEO pages: $(date -u +%Y-%m-%d)"
            git push
          fi
