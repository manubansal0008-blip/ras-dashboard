<script>
const FEEDS = [
  { url: 'https://www.thehindu.com/news/national/feeder/default.rss', source: 'The Hindu' },
  { url: 'https://indianexpress.com/section/india/feed/', source: 'Indian Express' },
  { url: 'https://www.pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3&reg=48', source: 'PIB' }
];
let allItems = [];
async function fetchFeed(feed) {
  try {
    const api = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feed.url);
    const res = await fetch(api);
    if (!res.ok) return [];
    const data = await res.json();
    if (data.status !== 'ok' || !data.items) return [];
    return data.items.slice(0, 12).map(item => ({
      title: item.title || 'Untitled',
      link: item.link || '#',
      date: item.pubDate || new Date().toISOString(),
      source: feed.source
    }));
  } catch (e) { return []; }
}
function formatDate(d) {
  try {
    const dt = new Date(d);
    if (isNaN(dt)) return '';
    return dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  } catch { return ''; }
}
